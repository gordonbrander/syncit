[package]
name = "syncit"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Two-way sync and partial replication between folders"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
diffy = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
